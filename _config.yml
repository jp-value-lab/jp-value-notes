# GitHub Pages（Jekyll）設定。この site/ ディレクトリだけを公開リポジトリに置く。
# 本体プロジェクト（コード・データ・秘密情報）は GitHub に上げないこと。
title: 日本株 中期バリュー戦略 — 公開検証ノート
description: >-
  日本株を対象に、割安(バリュー)ファクターで四半期リバランスする中期システム戦略を、
  ペーパー(想定100万円)で前向きに検証・公開する build in public の記録。
  検証で棄却した手法も含めて正直に書きます。※投資助言ではありません。投資判断は自己責任で。
lang: ja
author:
  name: jp-value-lab

# 公開URL（プロジェクトページ: https://jp-value-lab.github.io/jp-value-notes/）
# url + baseurl で canonical / OGP / sitemap の絶対URLが正しく生成される。
url: "https://jp-value-lab.github.io"
baseurl: "/jp-value-notes"

# テーマ（minima）+ ダークスキンでモダンな見た目に。詳細は assets/css/custom.css で上書き。
theme: minima
minima:
  skin: dark
show_excerpts: true

# SEO/配信プラグイン（いずれも GitHub Pages 公式サポート＝安全に有効化できる）
plugins:
  - jekyll-feed       # RSS/Atom フィード
  - jekyll-seo-tag    # title/description/OGP/Twitter/JSON-LD 構造化データを自動生成
  - jekyll-sitemap    # sitemap.xml 自動生成

# SNSシェア時のカード画像（OGP）。Twitterカードは _includes/head.html で明示。
image: /assets/og-image.png

header_pages:
  - about.md

# 公開物に紛れ込ませない（多層防御）
exclude:
  - "*.duckdb"
  - ".env"
  - "**/holdings.csv"
  - "**/paper_*.csv"
  - "**/orders_*.csv"
  - Gemfile
  - Gemfile.lock
  - README.md
